services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: probability
      POSTGRES_PASSWORD: probability
      POSTGRES_DB: probability_game
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probability -d probability_game"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://probability:probability@db:5432/probability_game
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
